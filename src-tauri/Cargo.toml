[package]
name = "cxview"
version = "0.1.0"
description = "Local-first Checkmarx remediation workbench"
authors = ["CXView"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cxview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2.0"
walkdir = "2.5"
oxc_parser = "0.133.0"
oxc_allocator = "0.133.0"
oxc_span = "0.133.0"
similar = "2.7"
which = "8.0"

[dev-dependencies]
tempfile = "3.23"

[features]
custom-protocol = ["tauri/custom-protocol"]
